# Effect schedulers. OCaml's concurrency libraries are mutually incompatible
# effect schedulers: performing one library's effect under another library's
# runtime is a guaranteed crash. This table says which entry point installs
# handlers for which family of effects.
#
#   scheduler <name>
#   run       <fully qualified entry point>
#   prefix    <effect-id prefix owned by this scheduler>
#
# Real Eio/Riot paths must be confirmed against installed sources before the
# ecosystem sweep; the mechanism is independent of the data.

scheduler eio
run       Eio_main.run
run       Eio_linux.run
run       Eio_posix.run
prefix    Eio
prefix    Eio_core

scheduler riot
run       Riot.run
prefix    Riot

scheduler moonpool
run       Moonpool.run
prefix    Moonpool

scheduler miou
run       Miou.run
run       Miou_unix.run
prefix    Miou

# Mock schedulers used by test/schedulers so the mechanism is exercised
# without needing the real libraries installed.
scheduler mock_a
run       Sched_a.run
prefix    Sched_a

scheduler mock_b
run       Sched_b.run
prefix    Sched_b
