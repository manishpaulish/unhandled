# Effect schedulers. OCaml's concurrency libraries are mutually incompatible
# effect schedulers: performing one library's effect under another library's
# runtime is a guaranteed crash. This table says which entry point installs
# handlers for which family of effects.
#
#   scheduler <name>
#   run       <fully qualified entry point>
#   prefix    <effect-id prefix owned by this scheduler>
#
# eio entries below were confirmed against ocaml-multicore/eio @ d3c8dd9:
#   lib_main/eio_main.ml:4          let run fn
#   lib_eio_posix/eio_posix.ml:21   let run main
#   lib_eio_linux/eio_linux.ml:153  let run ...
#   lib_eio/core/fiber.ml:1         Fiber.Fork
#   lib_eio/core/cancel.ml:32       Cancel.Get_context
#   lib_eio/core/suspend.ml:2       Suspend.Suspend
# Library names come from the dune stanzas (eio__core, eio_unix), which is why
# the prefixes use the mangled forms rather than "Eio".
#
# Eio also re-exports its effects through Eio__core.Private.Effects, e.g.
#   type _ Effect.t += Fork = Fiber.Fork
# Those aliases are canonicalised to the originals by Effect_id, so they need
# no entry here. See docs/TYPEDTREE-NOTES.md section 8.
#
# riot/moonpool/miou below are NOT yet confirmed against their sources.

scheduler eio
run       Eio_main.run
run       Eio_linux.run
run       Eio_linux.run_event_loop
run       Eio_posix.run
prefix    Eio__core
prefix    Eio_unix
prefix    Eio

# Calling into the API requires the runtime. We almost never have .cmt files
# for an installed dependency, so without these lines a call to
# Eio.Mutex.use_rw is merely "unresolved": it carries no named effect and
# nothing can be reported about it. The first retroactive batch caught 0 of 6
# for precisely this reason.
api       Eio.
api       Eio_unix.
api       Eio__core.

# Exceptions to the api rule: paths that sit under the same prefix but cannot
# suspend, so calling them does not imply a runtime. The first three escapes
# this tool reported on third-party code were all of this kind, in cohttp-eio:
#
#   cohttp-eio/src/body.ml:20    let of_string = let ops = Eio.Flow.Pi.source ...
#   cohttp-eio/src/utils.ml:44   let flow_of_reader = let handler = Eio.Flow.Pi.source ...
#   cohttp-eio/tests/test_forward_proxy.ml:9   Eio.Stream.create 1
#
# All three run at module initialisation of a widely deployed library. Were
# they really effectful, every program linking cohttp-eio would die before
# main. Confirmed pure against ocaml-multicore/eio @ ab4dd74:
#   lib_eio/flow.mli       Pi.source/sink/shutdown/two_way build a
#                          Resource.handler from a first-class module
#   lib_eio/resource.mli   handler : 't binding list -> ('t, _) handler
#   lib_eio/stream.mli     create allocates a queue; add and take block,
#                          take_nonblocking/length/is_empty do not
#
# This list grows only on an observed false positive whose purity is then
# confirmed in the source. Guessing swaps a false positive for a false
# negative, and the false negative is the one we claim not to have.
# A pattern starting with '*' matches anywhere in the path. Pi is eio's
# documented Provider Interface convention, used in flow, file, fs, time,
# process, domain_manager and eio_unix; every Pi function has the shape
#   (module X with type t = 't) -> ('t, ty) Resource.handler
# so it builds a vtable and cannot suspend.
pure      *.Pi.
pure      Eio.Resource.handler
pure      Eio.Stream.create
pure      Eio.Stream.length
pure      Eio.Stream.is_empty
pure      Eio.Stream.take_nonblocking
pure      Eio.Condition.create

# eio's own implementation. The api rule above models how a CLIENT uses the
# library: "you called Eio.Mutex.use_rw, so you need an Eio runtime". Applying
# it to eio's own source is a category error, and it produced all 21 findings
# in the eio repository, e.g.
#
#   lib_eio_posix/time.ml:12    let handler = Eio.Time.Pi.clock (module Mono_clock)
#   lib_eio_posix/err.ml:9      Eio.Exn.Backend.register_pp ...
#   lib_eio/unix/process.ml:168 let sigchld = Eio.Condition.create ()
#
# including one B3 boundary report that chained off the same synthetic effect
# through Domain.spawn in the domain manager.
#
# This suppresses the MODEL, not the analysis. A real Effect.perform inside
# eio is still read from the typed tree and still reported.
#
# Matching is exact or dune-wrapped (Eio_posix__Process), never a bare prefix,
# so Eio does not swallow the third-party Eio_ssl.
self      Eio
self      Eio_core
self      Eio_unix
self      Eio_posix
self      Eio_linux
self      Eio_main
self      Eio_mock
self      Eio_runtime_events

requires  Eio__core.Suspend.Suspend

scheduler riot
run       Riot.run
prefix    Riot
api       Riot.
self      Riot
requires  Riot.Effects.Receive

scheduler moonpool
run       Moonpool.run
prefix    Moonpool
self      Moonpool
requires  Moonpool.Effects.Suspend

scheduler miou
run       Miou.run
run       Miou_unix.run
prefix    Miou
self      Miou
self      Miou_unix
requires  Miou.Effects.Suspend

# Mock schedulers used by test/schedulers so the mechanism is exercised
# without needing the real libraries installed.
scheduler mock_a
run       Sched_a.run
prefix    Sched_a
self      Sched_a
requires  Sched_a.Yield

scheduler mock_b
run       Sched_b.run
prefix    Sched_b
self      Sched_b
requires  Sched_b.Tick
