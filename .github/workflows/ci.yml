name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 5.3 is the floor: Texp_match and Texp_try only gained their
        # effect-case lists in 5.3, so earlier compilers cannot express the
        # thing this tool analyses. 5.4 moved constructor descriptions from
        # Types to Data_types, which lib/compat_*.ml handles.
        ocaml-compiler: ["5.3", "5.4"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # Needs unhandled.opam to exist, otherwise this is a no-op and dune is
      # never installed. That is exactly how CI #1 and #2 failed with
      # "Command not found 'dune'".
      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      # Corpus, scenarios, and a real LSP session.
      - run: opam exec -- bash test/run_tests.sh

      # Self-host: the analyser must be clean on its own sources. It performs
      # no effects, so anything other than zero errors is a bug in us.
      - name: self-host
        run: |
          opam exec -- dune build @check
          opam exec -- ./_build/default/bin/unhandled.exe check _build/default/lib
          test $? -eq 0

      # Differential fuzzing, both modes. Branch-free must stay exact;
      # branching is allowed to over-approximate but never to miss a crash.
      - run: opam exec -- bash test/fuzz/run_fuzz.sh
        env:
          START: 1
          COUNT: 100

      - run: opam exec -- bash test/fuzz/run_fuzz.sh
        env:
          MODE: branch
          START: 1
          COUNT: 60
          ALLOW_FP: 1
